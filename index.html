<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chronicle of Skills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ── TOKENS ──────────────────────────────────────────── */
:root {
  --ink:    #0e0c0a;
  --parch:  #f5efe4;
  --parch2: #ede4d3;
  --parch3: #e0d4be;
  --gold:   #b8860b;
  --gold2:  #d4a017;
  --gold3:  #f0c040;
  --rust:   #8b3a2a;
  --moss:   #3d5a3e;
  --uriel-h:#6b3fa0;
  --uriel-l:#e8dff5;
  --guy-h:  #8b2020;
  --guy-l:  #f5dada;
  --border: rgba(90,70,30,0.25);
  --shadow: 0 4px 24px rgba(0,0,0,0.12);
}

/* ── RESET & BASE ─────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Crimson Pro',Georgia,serif;
  background: var(--parch);
  color: var(--ink);
  min-height:100vh;
  background-image:
    url("data:image/svg+xml,%3Csvg width='400' height='400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='400' height='400' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
}

/* ── SCROLLBAR ────────────────────────────────────────── */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--parch2)}
::-webkit-scrollbar-thumb{background:var(--gold);border-radius:3px}

/* ── NAV ──────────────────────────────────────────────── */
nav{
  position:sticky;top:0;z-index:100;
  background:var(--ink);
  border-bottom:2px solid var(--gold);
  display:flex;align-items:center;gap:0;
  padding:0 32px;
}
.nav-brand{
  font-family:'Cinzel',serif;
  color:var(--gold3);
  font-size:1rem;letter-spacing:0.12em;
  padding:14px 24px 14px 0;
  border-right:1px solid rgba(255,255,255,0.1);
  margin-right:8px;
  white-space:nowrap;
}
.nav-tabs{display:flex;gap:0;flex:1}
.tab-btn{
  font-family:'Cinzel',serif;
  font-size:0.72rem;letter-spacing:0.1em;
  color:rgba(245,239,228,0.5);
  background:none;border:none;cursor:pointer;
  padding:16px 20px;
  border-bottom:2px solid transparent;
  transition:all 0.2s;
  text-transform:uppercase;
}
.tab-btn:hover{color:var(--gold3)}
.tab-btn.active{color:var(--gold3);border-bottom-color:var(--gold3)}

/* ── MAIN ─────────────────────────────────────────────── */
main{max-width:1100px;margin:0 auto;padding:40px 24px 80px}

/* ── PAGE HEADER ──────────────────────────────────────── */
.page-header{text-align:center;margin-bottom:48px}
.page-header h1{
  font-family:'Cinzel',serif;
  font-size:3rem;font-weight:900;
  color:var(--ink);letter-spacing:0.06em;
  line-height:1.1;
}
.page-header .sub{
  font-style:italic;color:rgba(14,12,10,0.5);
  font-size:1.15rem;margin-top:6px;
}
.divider{
  display:flex;align-items:center;gap:16px;margin:20px auto;max-width:320px;
}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.divider span{font-family:'Cinzel',serif;color:var(--gold);font-size:0.9rem}

/* ── SECTION ─────────────────────────────────────────── */
.section-label{
  font-family:'Cinzel',serif;font-size:0.7rem;
  letter-spacing:0.18em;text-transform:uppercase;
  color:var(--gold);margin-bottom:20px;
  display:flex;align-items:center;gap:10px;
}
.section-label::after{content:'';flex:1;height:1px;background:var(--border)}

/* ── PLAYER CARDS ─────────────────────────────────────── */
.players-row{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:48px}
@media(max-width:600px){.players-row{grid-template-columns:1fr}}
.player-card{
  background:var(--parch2);
  border:1px solid var(--border);
  border-radius:4px;
  padding:28px 24px 20px;
  position:relative;
  overflow:hidden;
}
.player-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
}
.player-card.uriel::before{background:var(--uriel-h)}
.player-card.guy::before{background:var(--guy-h)}
.player-card .corner{
  position:absolute;top:10px;right:12px;
  font-family:'Cinzel',serif;font-size:0.65rem;
  letter-spacing:0.1em;opacity:0.35;text-transform:uppercase;
}
.avatar-row{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.avatar{
  width:52px;height:52px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:'Cinzel',serif;font-size:1.4rem;font-weight:900;
  flex-shrink:0;border:2px solid;
}
.uriel .avatar{background:var(--uriel-l);color:var(--uriel-h);border-color:var(--uriel-h)}
.guy .avatar{background:var(--guy-l);color:var(--guy-h);border-color:var(--guy-h)}
.p-name{font-family:'Cinzel',serif;font-size:1.3rem;font-weight:600;line-height:1}
.p-title{font-style:italic;color:var(--gold);font-size:0.95rem;margin-top:3px}
.p-level-badge{
  display:inline-block;
  font-family:'Cinzel',serif;font-size:0.65rem;
  letter-spacing:0.1em;padding:3px 10px;border-radius:2px;
  margin-top:8px;
}
.uriel .p-level-badge{background:var(--uriel-l);color:var(--uriel-h)}
.guy .p-level-badge{background:var(--guy-l);color:var(--guy-h)}
.xp-track{margin:16px 0 10px}
.xp-labels{display:flex;justify-content:space-between;font-size:0.78rem;color:rgba(14,12,10,0.5);margin-bottom:6px}
.xp-rail{height:6px;background:rgba(0,0,0,0.1);border-radius:3px;overflow:hidden}
.xp-fill{height:100%;border-radius:3px;transition:width 0.7s cubic-bezier(.22,1,.36,1)}
.uriel .xp-fill{background:linear-gradient(90deg,var(--uriel-h),#9b6fd4)}
.guy .xp-fill{background:linear-gradient(90deg,var(--guy-h),#d06060)}
.p-stats{display:flex;gap:0;border-top:1px solid var(--border);margin-top:16px;padding-top:16px}
.p-stat{flex:1;text-align:center;border-right:1px solid var(--border)}
.p-stat:last-child{border-right:none}
.p-stat-n{font-family:'Cinzel',serif;font-size:1.4rem;font-weight:600;line-height:1}
.p-stat-l{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.1em;color:rgba(14,12,10,0.45);margin-top:3px}

/* ── QUESTS GRID ─────────────────────────────────────── */
.quests-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.quest-card{
  background:var(--parch2);border:1px solid var(--border);
  border-radius:4px;padding:20px;
  position:relative;transition:box-shadow 0.2s,transform 0.2s;
}
.quest-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.quest-card.weekly{border-color:var(--gold2);background:#fdf8ee}
.quest-card.weekly::after{
  content:'WEEKLY';position:absolute;top:0;right:14px;
  font-family:'Cinzel',serif;font-size:0.58rem;letter-spacing:0.15em;
  background:var(--gold2);color:#fff;padding:2px 7px;border-radius:0 0 4px 4px;
}
.q-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px}
.q-name{font-family:'Cinzel',serif;font-size:1rem;font-weight:600;line-height:1.2;flex:1;margin-right:10px}
.tier-pip{
  width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:3px;
}
.pip-common{background:#94a3b8}.pip-uncommon{background:#4ade80}
.pip-rare{background:#60a5fa}.pip-legendary{background:var(--gold3)}
.q-lore{
  font-style:italic;font-size:0.85rem;color:rgba(14,12,10,0.55);
  margin:6px 0 4px;line-height:1.4;
}
.q-desc{font-size:0.9rem;color:rgba(14,12,10,0.75);line-height:1.5;margin-bottom:6px}
.q-meta{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.q-tag{
  font-size:0.68rem;text-transform:uppercase;letter-spacing:0.08em;
  background:rgba(0,0,0,0.06);color:rgba(14,12,10,0.55);
  padding:2px 7px;border-radius:2px;
}
.q-xp{font-family:'Cinzel',serif;font-size:0.78rem;color:var(--gold)}
.q-actions{display:flex;gap:8px}
.q-btn{
  flex:1;border:1px solid;border-radius:3px;
  font-family:'Cinzel',serif;font-size:0.72rem;letter-spacing:0.06em;
  padding:9px 8px;cursor:pointer;transition:all 0.15s;
  display:flex;align-items:center;justify-content:center;gap:5px;
}
.q-btn.uriel-btn{
  background:var(--uriel-l);color:var(--uriel-h);border-color:var(--uriel-h);
}
.q-btn.uriel-btn:hover:not(:disabled){background:var(--uriel-h);color:#fff}
.q-btn.guy-btn{
  background:var(--guy-l);color:var(--guy-h);border-color:var(--guy-h);
}
.q-btn.guy-btn:hover:not(:disabled){background:var(--guy-h);color:#fff}
.q-btn:disabled{opacity:0.4;cursor:default;background:transparent}
.q-btn .done-mark{font-size:0.9rem}

/* ── PROFILES TAB ────────────────────────────────────── */
.profiles-grid{display:grid;grid-template-columns:1fr 1fr;gap:32px}
@media(max-width:640px){.profiles-grid{grid-template-columns:1fr}}
.profile-big{
  background:var(--parch2);border:1px solid var(--border);border-radius:4px;
  overflow:hidden;
}
.profile-banner{
  height:80px;display:flex;align-items:center;justify-content:center;
  position:relative;
}
.uriel .profile-banner{background:linear-gradient(135deg,#3d1f6b,#6b3fa0)}
.guy .profile-banner{background:linear-gradient(135deg,#6b1010,#8b2020)}
.profile-banner-avatar{
  width:72px;height:72px;border-radius:50%;
  border:3px solid rgba(255,255,255,0.4);
  display:flex;align-items:center;justify-content:center;
  font-family:'Cinzel',serif;font-size:2rem;font-weight:900;
  color:rgba(255,255,255,0.9);
  position:absolute;bottom:-36px;
}
.profile-body{padding:48px 24px 24px;text-align:center}
.profile-name{font-family:'Cinzel',serif;font-size:1.6rem;font-weight:900}
.profile-title{font-style:italic;color:var(--gold);font-size:1rem;margin-top:4px}
.profile-class{
  display:inline-block;margin-top:10px;
  font-family:'Cinzel',serif;font-size:0.65rem;letter-spacing:0.15em;text-transform:uppercase;
  padding:4px 14px;border-radius:2px;border:1px solid;
}
.uriel .profile-class{background:var(--uriel-l);color:var(--uriel-h);border-color:var(--uriel-h)}
.guy .profile-class{background:var(--guy-l);color:var(--guy-h);border-color:var(--guy-h)}
.profile-stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:0;
  margin-top:24px;border-top:1px solid var(--border);
}
.ps{padding:16px 8px;text-align:center;border-right:1px solid var(--border)}
.ps:last-child{border-right:none}
.ps-n{font-family:'Cinzel',serif;font-size:1.6rem;font-weight:600}
.ps-l{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.09em;color:rgba(14,12,10,0.45);margin-top:2px}
.recent-quests{padding:0 24px 24px}
.rq-item{
  display:flex;align-items:center;gap:10px;
  padding:8px 0;border-bottom:1px solid var(--border);font-size:0.88rem;
}
.rq-item:last-child{border-bottom:none}
.rq-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.rq-name{flex:1;font-style:italic}
.rq-xp{font-family:'Cinzel',serif;font-size:0.8rem;color:var(--gold)}
.rq-time{font-size:0.72rem;color:rgba(14,12,10,0.4)}
.cat-breakdown{padding:0 24px 24px}
.cat-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:0.85rem}
.cat-name{width:90px;font-style:italic;color:rgba(14,12,10,0.65)}
.cat-bar-rail{flex:1;height:5px;background:rgba(0,0,0,0.08);border-radius:3px;overflow:hidden}
.cat-bar-fill{height:100%;border-radius:3px}
.cat-count{font-family:'Cinzel',serif;font-size:0.78rem;color:var(--gold);width:18px;text-align:right}

/* ── LOG TAB ─────────────────────────────────────────── */
.log-table{width:100%;border-collapse:collapse}
.log-table th{
  font-family:'Cinzel',serif;font-size:0.65rem;letter-spacing:0.12em;
  text-transform:uppercase;color:var(--gold);
  padding:8px 12px;border-bottom:2px solid var(--border);
  text-align:left;
}
.log-table td{
  padding:11px 12px;border-bottom:1px solid var(--border);
  font-size:0.88rem;vertical-align:middle;
}
.log-table tr:hover td{background:rgba(0,0,0,0.03)}
.log-player-pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 9px;border-radius:2px;font-size:0.78rem;
  font-family:'Cinzel',serif;letter-spacing:0.04em;
}
.lp-uriel{background:var(--uriel-l);color:var(--uriel-h)}
.lp-guy{background:var(--guy-l);color:var(--guy-h)}
.log-xp{font-family:'Cinzel',serif;color:var(--gold);font-weight:600}
.empty-state{text-align:center;padding:60px 20px;font-style:italic;color:rgba(14,12,10,0.4);font-size:1.1rem}

/* ── TOAST ───────────────────────────────────────────── */
.toast{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--gold3);
  font-family:'Cinzel',serif;font-size:0.85rem;letter-spacing:0.06em;
  padding:12px 24px;border-radius:3px;border:1px solid var(--gold);
  opacity:0;transition:all 0.3s;pointer-events:none;z-index:999;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── TABS ────────────────────────────────────────────── */
.tab-page{display:none}
.tab-page.active{display:block}

/* ── LOADING ─────────────────────────────────────────── */
.loading{text-align:center;padding:60px;font-style:italic;color:rgba(14,12,10,0.4);font-size:1.1rem}
</style>
</head>

<nav>
  <div class="nav-brand">⚔ Chronicle</div>

</div>

let players=[], quests=[], completions=[];

function getWeekStart(){
  const d=new Date();const day=d.getDay();
  const diff=d.getDate()-day+(day===0?-6:1);
  const m=new Date(d);m.setDate(diff);m.setHours(0,0,0,0);return m.toISOString();
}

/* ───────── LOAD ───────── */
async function loadAll(){
  const [pR,qR,cR]=await Promise.all([
    sb.from('players').select('*').order('id'),
    sb.from('quests').select('*').order('id',{ascending:false}),
    sb.from('completions').select('*').order('created_at',{ascending:false}).limit(200)
  ]);
  players=pR.data||[]; quests=qR.data||[]; completions=cR.data||[];
  await ensurePlayers(); await ensureQuests();
  renderAll();
}

async function ensurePlayers(){
  const names=players.map(p=>p.name);
  const miss=["Uriel","Guy"].filter(n=>!names.includes(n));
  if(miss.length){
    await sb.from('players').insert(miss.map(n=>({name:n,xp:0,streak:0})));
    const p=await sb.from('players').select('*').order('id');
    players=p.data||[];
  }
}

async function ensureQuests(){
  if(quests.length===0){
    await sb.from('quests').insert(QUESTS);
    const q=await sb.from('quests').select('*').order('id',{ascending:false});
    quests=q.data||[];
  }
}

/* ───────── COMPLETE ───────── */
async function completeQuest(pid, qid){
  const quest=quests.find(q=>q.id===qid);
  const player=players.find(p=>p.id===pid);
  if(!quest||!player) return;

  const isWeekly = quest.category==='Weekly';
  const ws = getWeekStart();

  // Block duplicate completions
  const already = isWeekly
    ? completions.find(c=>c.player_id===pid&&c.quest_id===qid&&c.created_at>=ws)
    : completions.find(c=>c.player_id===pid&&c.quest_id===qid);

  if(already){ showToast("Quest already completed!"); return; }

  const base=XP_MAP[quest.tier]||50;
  const xp=isWeekly?Math.round(base*1.5):base;
  const prevLv=getLevel(player.xp||0);

  await sb.from('completions').insert([{player_id:pid,quest_id:qid,xp_earned:xp}]);
  await sb.from('players').update({xp:(player.xp||0)+xp}).eq('id',pid);

  // Optimistic update so buttons disable instantly
  completions.unshift({player_id:pid,quest_id:qid,xp_earned:xp,created_at:new Date().toISOString()});
  players=players.map(p=>p.id===pid?{...p,xp:(p.xp||0)+xp}:p);

  const newLv=getLevel((player.xp||0)+xp);
  if(newLv>prevLv) showToast(`${player.name} reached Level ${newLv} — ${getTitle((player.xp||0)+xp)}!`);
  else showToast(`+${xp} XP for ${player.name}!`);

  renderAll();
}

/* ───────── RENDER ───────── */
function renderAll(){
  renderOverview();
  renderQuests();
  renderProfiles();
  renderLog();
}

function renderOverview(){
  document.getElementById('players-overview').innerHTML = players.map(p=>{
    const xp=p.xp||0, lv=getLevel(xp), xpIn=getXpIn(xp), pct=Math.round(xpIn/500*100);
    const cls=p.name.toLowerCase();
    const total=completions.filter(c=>c.player_id===p.id).length;
    const thisWeek=completions.filter(c=>c.player_id===p.id&&c.created_at>=getWeekStart()).length;
    return `<div class="player-card ${cls}">
      <div class="corner">${p.name}</div>
      <div class="avatar-row">
        <div class="avatar">${p.name[0]}</div>
        <div>
          <div class="p-name">${p.name}</div>
          <div class="p-title">${getTitle(xp)}</div>
          <div class="p-level-badge">LEVEL ${lv}</div>
        </div>
      </div>
      <div class="xp-track">
        <div class="xp-labels"><span>${xpIn} XP</span><span>${500-xpIn} to next</span></div>
        <div class="xp-rail"><div class="xp-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="p-stats">
        <div class="p-stat"><div class="p-stat-n">${xp}</div><div class="p-stat-l">Total XP</div></div>
        <div class="p-stat"><div class="p-stat-n">${total}</div><div class="p-stat-l">Completed</div></div>
        <div class="p-stat"><div class="p-stat-n">${thisWeek}</div><div class="p-stat-l">This Week</div></div>
      </div>
    </div>`;
  }).join('');
}

function renderQuests(){
  const ws=getWeekStart();
  const isDone=(pid,qid,weekly)=>{
    if(weekly) return completions.find(c=>c.player_id===pid&&c.quest_id===qid&&c.created_at>=ws);
    return completions.find(c=>c.player_id===pid&&c.quest_id===qid);
  };
  document.getElementById('quests-grid').innerHTML = quests.map(q=>{
    const isWeekly=q.category==='Weekly';
    const base=XP_MAP[q.tier]||50;
    const xpShow=isWeekly?`+${Math.round(base*1.5)} XP ✦ 1.5×`:`+${base} XP`;
    const btns=players.map(p=>{
      const done=isDone(p.id,q.id,isWeekly);
      const cls=p.name==='Uriel'?'uriel-btn':'guy-btn';
      return `<button class="q-btn ${cls}"${done?' disabled':''} onclick="completeQuest(${p.id},${q.id})">
        ${done?'<span class="done-mark">✓</span> ':''}${p.name}
      </button>`;
    }).join('');
    return `<div class="quest-card${isWeekly?' weekly':''}">
      <div class="q-top">
        <div class="q-name">${q.name}</div>
        <div class="tier-pip pip-${q.tier}" title="${q.tier}"></div>
      </div>
      ${q.lore?`<div class="q-lore">"${q.lore}"</div>`:''}
      <div class="q-desc">${q.description}</div>
      <div class="q-meta">
        <span class="q-tag">${q.category}</span>
        <span class="q-tag">${q.tier}</span>
        <span class="q-xp">${xpShow}</span>
      </div>
      <div class="q-actions">${btns}</div>
    </div>`;
  }).join('');
}

function renderProfiles(){
  document.getElementById('profiles-grid').innerHTML = players.map(p=>{
    const xp=p.xp||0, lv=getLevel(xp);
    const cls=p.name.toLowerCase();
    const pComp=completions.filter(c=>c.player_id===p.id);
    const totalXp=pComp.reduce((s,c)=>s+c.xp_earned,0);
    const recent=pComp.slice(0,5);
    const catCounts={};
    for(const c of pComp){
      const q=quests.find(qu=>qu.id===c.quest_id);
      if(q){ catCounts[q.category]=(catCounts[q.category]||0)+1; }
    }
    const maxCat=Math.max(1,...Object.values(catCounts));
    const catRows=Object.entries(catCounts).sort((a,b)=>b[1]-a[1]).map(([cat,cnt])=>`
      <div class="cat-row">
        <div class="cat-name">${cat}</div>
        <div class="cat-bar-rail"><div class="cat-bar-fill" style="width:${Math.round(cnt/maxCat*100)}%;background:${CAT_COLORS[cat]||'#888'}"></div></div>
        <div class="cat-count">${cnt}</div>
      </div>`).join('');
    const recentRows=recent.map(c=>{
      const q=quests.find(qu=>qu.id===c.quest_id);
      if(!q) return '';
      const time=new Date(c.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric'});
      return `<div class="rq-item">
        <div class="rq-dot" style="background:${CAT_COLORS[q.category]||'#888'}"></div>
        <div class="rq-name">${q.name}</div>
        <div class="rq-xp">+${c.xp_earned}</div>
        <div class="rq-time">${time}</div>
      </div>`;
    }).join('');
    const rank=players.slice().sort((a,b)=>(b.xp||0)-(a.xp||0)).findIndex(pl=>pl.id===p.id)+1;
    const classInfo=CLASSES[p.name]||{name:"Unknown",desc:""};
    return `<div class="profile-big ${cls}">
      <div class="profile-banner">
        <div class="profile-banner-avatar">${p.name[0]}</div>
      </div>
      <div class="profile-body">
        <div class="profile-name">${p.name}</div>
        <div class="profile-title">${getTitle(xp)}</div>
        <div class="profile-class">${classInfo.name}</div>
        <div class="profile-stats">
          <div class="ps"><div class="ps-n">${lv}</div><div class="ps-l">Level</div></div>
          <div class="ps"><div class="ps-n">#${rank}</div><div class="ps-l">Rank</div></div>
          <div class="ps"><div class="ps-n">${pComp.length}</div><div class="ps-l">Quests</div></div>
        </div>
      </div>
      ${catRows?`<div class="cat-breakdown"><div class="section-label" style="font-size:0.6rem">By Category</div>${catRows}</div>`:''}
      ${recentRows?`<div class="recent-quests"><div class="section-label" style="font-size:0.6rem">Recent Deeds</div>${recentRows}</div>`:''}
    </div>`;
  }).join('');
}

function renderLog(){
  if(!completions.length){
    document.getElementById('log-table-wrap').innerHTML='<div class="empty-state">No deeds recorded yet. The chronicle awaits.</div>';
    return;
  }
  const rows=completions.slice(0,50).map(c=>{
    const p=players.find(pl=>pl.id===c.player_id);
    const q=quests.find(qu=>qu.id===c.quest_id);
    if(!p||!q) return '';
    const pCls=p.name==='Uriel'?'lp-uriel':'lp-guy';
    const time=new Date(c.created_at).toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
    return `<tr>
      <td><span class="log-player-pill ${pCls}">${p.name}</span></td>
      <td style="font-style:italic">${q.name}</td>
      <td><span class="q-tag">${q.category}</span></td>
      <td class="log-xp">+${c.xp_earned}</td>
      <td style="color:rgba(14,12,10,0.45);font-size:0.8rem">${time}</td>
    </tr>`;
  }).filter(Boolean).join('');
  document.getElementById('log-table-wrap').innerHTML=`
    <table class="log-table">
      <thead><tr><th>Adventurer</th><th>Deed</th><th>Domain</th><th>XP</th><th>When</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

/* ───────── TOAST ───────── */
let toastTimer;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2800);
}

/* ───────── TABS ───────── */
function switchTab(name){
  document.querySelectorAll('.tab-page').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  event.target.classList.add('active');
}

/* ───────── REALTIME ───────── */
sb.channel('chr-v3')
  .on('postgres_changes',{event:'*',schema:'public',table:'players'},loadAll)
  .on('postgres_changes',{event:'*',schema:'public',table:'quests'},loadAll)
  .on('postgres_changes',{event:'*',schema:'public',table:'completions'},loadAll)
  .subscribe();

loadAll();
</script>
